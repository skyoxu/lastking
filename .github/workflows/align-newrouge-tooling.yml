name: Align newrouge tooling

on:
  push:
    branches:
      - align-newrouge-features-20260912
    paths:
      - .github/workflows/align-newrouge-tooling.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout lastking
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: align-newrouge-features-20260912

      - name: Checkout newrouge main
        uses: actions/checkout@v4
        with:
          repository: skyoxu/newrouge
          ref: main
          path: _upstream/newrouge

      - name: Copy workflow, chapter skills, knowledge and project-health stack
        shell: bash
        run: |
          set -euo pipefail
          src="_upstream/newrouge"

          cp "$src/workflow.md" workflow.md

          rm -rf .agents/skills
          mkdir -p .agents
          cp -a "$src/.agents/skills" .agents/skills

          mkdir -p knowledge
          cp "$src/knowledge/README.md" knowledge/README.md
          for d in contracts evaluation policies; do
            rm -rf "knowledge/$d"
            cp -a "$src/knowledge/$d" "knowledge/$d"
          done

          files=(
            scripts/python/update_workflow_chapter_skills.py
            scripts/python/_knowledge_catalog_builder.py
            scripts/python/_knowledge_locator_core.py
            scripts/python/impact_analysis_handoff.py
            scripts/python/impact_analysis_index.py
            scripts/python/impact_analyzer.py
            scripts/python/analyze_impact.py
            scripts/python/build_impact_index.py
            scripts/python/build_knowledge_catalog.py
            scripts/python/project_health_knowledge.py
            scripts/python/project_health_knowledge.html
            scripts/python/project_health_knowledge.js
            scripts/python/project_health_knowledge.css
            scripts/python/project_health_knowledge_config.json
            scripts/python/_project_health_http.py
            scripts/python/_project_health_navigation.py
            scripts/python/_project_health_tasks.py
            scripts/python/_project_health_runtime_snapshot.py
            scripts/python/project_health_runtime.py
            scripts/python/_project_health_server.py
            scripts/python/_project_health_common.py
            scripts/python/_project_health_schema.py
            scripts/python/dev_cli.py
            scripts/python/dev_cli_builders.py
            scripts/python/project_health_scan.py
            scripts/python/serve_project_health.py
            scripts/python/chapter6_knowledge.py
            docs/workflows/project-health-knowledge.md
            docs/workflows/project-health-dashboard.md
          )
          for f in "${files[@]}"; do
            test -f "$src/$f" || { echo "missing upstream file: $f" >&2; exit 2; }
            mkdir -p "$(dirname "$f")"
            cp "$src/$f" "$f"
          done

          mkdir -p scripts/python/tests scripts/sc/tests
          for f in "$src"/scripts/python/tests/test_impact*.py "$src"/scripts/python/tests/test_project_health*.py "$src"/scripts/sc/tests/test_project_health*.py; do
            [ -e "$f" ] || continue
            rel="${f#${src}/}"
            mkdir -p "$(dirname "$rel")"
            cp "$f" "$rel"
          done

          rm -rf _upstream
          rm -f .github/workflows/align-newrouge-tooling.yml

      - name: Commit synchronized tooling
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No synchronization changes."
            exit 0
          fi
          git commit -m "feat(tooling): align workflow knowledge impact and project health"
          git push origin HEAD:align-newrouge-features-20260912
