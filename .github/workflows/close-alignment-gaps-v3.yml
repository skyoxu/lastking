name: Close Alignment Gaps V3

on:
  push:
    branches:
      - close-alignment-gaps-20260912
    paths:
      - .github/workflows/close-alignment-gaps-v3.yml

permissions:
  contents: write

jobs:
  close-gaps:
    runs-on: windows-latest
    steps:
      - name: Checkout target
        uses: actions/checkout@v4
        with:
          ref: close-alignment-gaps-20260912
          fetch-depth: 0

      - name: Checkout source snapshot
        uses: actions/checkout@v4
        with:
          repository: skyoxu/newrouge
          ref: edb78e7e76adbf4000a9816ac5070ec3612f688e
          path: _upstream/newrouge
          fetch-depth: 1

      - name: Copy bounded bundles
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $src = '_upstream/newrouge'
          $files = @(
            'scripts/python/_chapter7_profile.py',
            'scripts/python/collect_ui_wiring_inputs.py',
            'scripts/python/run_chapter7_ui_wiring.py',
            'scripts/python/chapter7_ui_gdd_writer.py',
            'scripts/python/create_chapter7_tasks_from_ui_candidates.py',
            'scripts/python/validate_chapter7_ui_wiring.py',
            'scripts/python/validate_chapter7_artifact_manifest.py',
            'scripts/python/tests/test_chapter7_ui_wiring.py',
            'docs/workflows/chapter7-profile-guide.md',
            'docs/workflows/templates/chapter7-profile.template.json',
            'docs/workflows/templates/chapter7-profile.minimal.example.json',
            'scripts/python/init_knowledge_catalog.py',
            'scripts/python/publish_knowledge_catalog.py',
            'scripts/python/knowledge_locator.py',
            'scripts/python/evaluate_knowledge_queries.py',
            'scripts/python/validate_knowledge_control_plane.py',
            'scripts/python/prepare_knowledge_context.py',
            'scripts/python/freeze_knowledge_context.py',
            'scripts/python/knowledge_binding_producer.py',
            'scripts/python/run_single_task_chapter6_lane.py',
            'scripts/python/tests/test_knowledge_control_plane.py',
            'scripts/python/tests/test_knowledge_chapter5_routing.py',
            'scripts/python/tests/test_knowledge_chapter6_routing.py',
            'scripts/python/tests/test_run_single_task_chapter6_lane.py',
            'scripts/python/tests/test_knowledge_review_routing.py',
            'scripts/python/tests/test_knowledge_freeze.py',
            'scripts/python/tests/test_knowledge_publication.py',
            'docs/adr/ADR-0035-repository-knowledge-control-plane.md',
            'docs/workflows/knowledge-context-shadow.md',
            'docs/workflows/knowledge-context-freeze.md',
            'docs/workflows/knowledge-catalog-main-publish.md',
            'scripts/python/impact_analysis_config.v1.json',
            'scripts/python/impact_target_aliases.v1.json'
          )
          foreach ($relative in $files) {
            $from = Join-Path $src $relative
            if (-not (Test-Path $from)) { throw "Missing source file: $relative" }
            $parent = Split-Path $relative -Parent
            if ($parent) { New-Item -ItemType Directory -Force -Path $parent | Out-Null }
            Copy-Item -Force $from $relative
          }

      - name: Adapt source-neutral tooling to lastking
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $path = 'scripts/python/init_knowledge_catalog.py'
          $text = Get-Content -Raw -Encoding UTF8 $path
          $text = $text.Replace('"project": "newrouge"', '"project": "lastking"')
          Set-Content -Path $path -Value $text -Encoding UTF8NoBOM

          $path = 'scripts/python/knowledge_locator.py'
          $text = Get-Content -Raw -Encoding UTF8 $path
          $text = $text.Replace('Locate authoritative newrouge repository knowledge without synthesizing answers.', 'Locate authoritative repository knowledge without synthesizing answers.')
          Set-Content -Path $path -Value $text -Encoding UTF8NoBOM

          $path = 'scripts/python/validate_knowledge_control_plane.py'
          $text = Get-Content -Raw -Encoding UTF8 $path
          $text = $text.Replace('Terminal validation for the newrouge repository Knowledge Control Plane.', 'Terminal validation for the repository Knowledge Control Plane.')
          Set-Content -Path $path -Value $text -Encoding UTF8NoBOM

          $path = 'docs/adr/ADR-0035-repository-knowledge-control-plane.md'
          $text = Get-Content -Raw -Encoding UTF8 $path
          $text = $text.Replace('`newrouge`', '`lastking`')
          Set-Content -Path $path -Value $text -Encoding UTF8NoBOM

          $path = 'scripts/python/impact_analysis_config.v1.json'
          $text = Get-Content -Raw -Encoding UTF8 $path
          $text = $text.Replace('NewRouge.csproj', 'lastking.csproj')
          Set-Content -Path $path -Value $text -Encoding UTF8NoBOM

          $testPath = 'scripts/python/tests/test_chapter7_ui_wiring.py'
          $testText = Get-Content -Raw -Encoding UTF8 $testPath
          $old = 'self.assertTrue(contract["repo_root"].endswith(root.as_posix()))'
          $new = 'self.assertEqual(Path(contract["repo_root"]).resolve(), root.resolve())'
          if (-not $testText.Contains($old)) { throw 'Chapter7 canonical-path assertion marker not found' }
          $testText = $testText.Replace($old, $new)
          Set-Content -Path $testPath -Value $testText -Encoding UTF8NoBOM

          $routing = 'docs/agents/13-rag-sources-and-session-ssot.md'
          $routingText = Get-Content -Raw -Encoding UTF8 $routing
          if (-not $routingText.Contains('## Knowledge Control Plane')) {
            $extra = @(
              '',
              '## Knowledge Control Plane',
              'Use `scripts/python/knowledge_locator.py` as the deterministic location-only lookup when a current published catalog is available. Locator candidates are not semantic truth: re-read the repository source and verify its hash before accepting context.',
              '',
              'Chapter 4/5/6 and review may use the observe-only flow in `docs/workflows/knowledge-context-shadow.md`, followed by the explicit decision/freeze contract in `docs/workflows/knowledge-context-freeze.md`. If publication is missing, stale, or blocked, fall back to the direct authoritative source routes listed above; do not rebuild global knowledge implicitly.'
            ) -join [Environment]::NewLine
            Set-Content -Path $routing -Value ($routingText.TrimEnd() + [Environment]::NewLine + $extra + [Environment]::NewLine) -Encoding UTF8NoBOM
          }

          $adrIndex = 'docs/architecture/ADR_INDEX_GODOT.md'
          $adrText = Get-Content -Raw -Encoding UTF8 $adrIndex
          if (-not $adrText.Contains('ADR-0035')) {
            $needle = '- ADR-0030: Core 线程模型（Single-Thread Core + 明确跨线程边界） — `docs/adr/ADR-0030-core-threading-model.md`'
            $replacement = $needle + "`n- ADR-0035: Repository Knowledge Control Plane — ``docs/adr/ADR-0035-repository-knowledge-control-plane.md``"
            $adrText = $adrText.Replace($needle, $replacement)
            Set-Content -Path $adrIndex -Value $adrText -Encoding UTF8NoBOM
          }

      - name: Generate target Chapter 7 profile
        shell: pwsh
        run: |
          @'
          import importlib.util
          import json
          from pathlib import Path
          root = Path.cwd()
          spec = importlib.util.spec_from_file_location('chapter7_profile_alignment', root / 'scripts/python/_chapter7_profile.py')
          module = importlib.util.module_from_spec(spec)
          assert spec and spec.loader
          spec.loader.exec_module(module)
          profile = module.build_default_chapter7_profile()
          payload = {
              'surface_aliases': profile['surface_aliases'],
              'task_creation': profile['task_creation'],
              'buckets': {name: {'section_headings': profile['buckets'][name]['section_headings']} for name in module.bucket_names(profile)},
          }
          out = root / 'docs/workflows/chapter7-profile.json'
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(json.dumps(payload, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          '@ | Set-Content -Path _make_target_profile.py -Encoding UTF8NoBOM
          py -3 _make_target_profile.py
          Remove-Item _make_target_profile.py

      - name: Initialize target resource knowledge catalog
        shell: pwsh
        run: |
          py -3 scripts/python/init_knowledge_catalog.py --repo-root . --validate

      - name: Validate bounded closure
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:CI = ''
          py -3 scripts/python/validate_knowledge_control_plane.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          py -3 -m unittest scripts.python.tests.test_chapter7_ui_wiring -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          py -3 -m unittest scripts.python.tests.test_impact_analysis_index scripts.python.tests.test_analyze_impact_cli -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          py -3 -m unittest scripts.python.tests.test_impact_analysis_handoff scripts.python.tests.test_impact_analyzer -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          py -3 -m unittest scripts.sc.tests.test_project_health_knowledge scripts.sc.tests.test_project_health_navigation scripts.sc.tests.test_project_health_runtime_snapshot scripts.sc.tests.test_project_health_server -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check scripts/python/project_health_knowledge.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate target adaptations
        shell: pwsh
        run: |
          @'
          import importlib.util
          import json
          from pathlib import Path
          root = Path.cwd()
          impact = json.loads((root / 'scripts/python/impact_analysis_config.v1.json').read_text(encoding='utf-8'))
          assert 'lastking.csproj' in impact['identity_files']
          assert 'NewRouge.csproj' not in impact['identity_files']
          assert (root / 'scripts/python/impact_target_aliases.v1.json').is_file()
          catalog = json.loads((root / 'docs/knowledge/catalog/knowledge-catalog.json').read_text(encoding='utf-8'))
          assert catalog['project'] == 'lastking'
          spec = importlib.util.spec_from_file_location('chapter7_profile_verify', root / 'scripts/python/_chapter7_profile.py')
          module = importlib.util.module_from_spec(spec)
          assert spec and spec.loader
          spec.loader.exec_module(module)
          profile = module.load_chapter7_profile(repo_root=root)
          expected = {'entry': 41, 'loop': 42, 'combat': 43, 'economy': 44, 'meta': 45, 'governance': 46}
          assert {name: int(profile['buckets'][name]['wiring_task_id']) for name in expected} == expected
          active = json.loads((root / 'docs/workflows/chapter7-profile.json').read_text(encoding='utf-8'))
          assert 'task_scope' not in active
          assert 'map_path' not in active.get('buckets', {})
          assert not (root / '.agents/skills/pr-ci-artifact-repair').exists()
          assert not (root / 'knowledge/snapshots').exists()
          assert not (root / 'knowledge/indexes/current.json').exists()
          print('target adaptation checks passed')
          '@ | Set-Content -Path _verify_target_adaptations.py -Encoding UTF8NoBOM
          py -3 _verify_target_adaptations.py
          Remove-Item _verify_target_adaptations.py
          git diff --check

      - name: Commit closure and self-clean
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force _upstream
          Remove-Item -Force .github/workflows/close-alignment-gaps.yml
          Remove-Item -Force .github/workflows/close-alignment-gaps-v2.yml
          Remove-Item -Force .github/workflows/close-alignment-gaps-v3.yml
          git add -A
          git diff --cached --check
          if ((git status --porcelain).Length -eq 0) { exit 0 }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(tooling): close workflow knowledge and impact alignment gaps'
          git push origin HEAD:close-alignment-gaps-20260912
