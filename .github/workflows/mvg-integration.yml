name: MVG Integration

on:
  workflow_dispatch:
    inputs:
      mutation_probe:
        description: Run the optional seeded BattleMap mutation experiment
        type: boolean
        default: false
  pull_request:
    paths:
      - '.github/workflows/mvg-integration.yml'
      - 'scripts/python/*mvg*'
      - 'scripts/python/tests/test_mvg*'
      - 'scripts/python/_project_health_runtime_snapshot.py'
      - 'scripts/python/run_gdunit.py'
      - 'scripts/python/check_workflow_gate_enforcement.py'
      - 'scripts/python/config/workflow-gate-allowlist.json'
      - 'docs/testing/mvg/**'
      - '.taskmaster/tasks/tasks.json'
      - 'docs/workflows/mvg-integration-acceptance.md'
      - 'decision-logs/2026-09-18-mvg-integration.md'
      - 'execution-plans/2026-09-18-mvg-integration-alignment.md'
      - 'Game.Core/Services/ResourceManager.cs'
      - 'Game.Core/Services/Building/BuildingPlacementService.cs'
      - 'Game.Core/Contracts/Lastking/ResourcesChanged.cs'
      - 'Game.Core.Tests/Integration/Mvg*'
      - 'Game.Godot/Scripts/UI/HUD.cs'
      - 'Game.Godot/Scripts/Screens/BattleMapScreen.gd'
      - 'Game.Godot/Scenes/UI/HUD.tscn'
      - 'Game.Godot/Scenes/Screens/BattleMapScreen.tscn'
      - 'Tests.Godot/tests/Integration/Mvg/**'
      - 'Tests.Godot/tests/Integration/test_battlemap_local_runtime_controls.gd'

permissions:
  contents: read

jobs:
  battlemap-pilot:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: 'utf-8'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Download Godot .NET
        shell: pwsh
        run: ./scripts/ci/download_godot_release.ps1 -Version '4.5.1' -PreferConsole
      - name: Verify MVG coverage runner failure handling
        run: python -m unittest discover -s scripts/python/tests -p test_mvg_acceptance.py -v
      - name: Run committed BattleMap pilot and disconnected-input challenge
        shell: pwsh
        run: python scripts/python/run_mvg_acceptance.py --mode run --snapshot commit --revision HEAD --godot-bin $env:GODOT_BIN --timeout-sec 1200 --challenge-input
      - name: Run workspace BattleMap pilot
        shell: pwsh
        run: python scripts/python/run_mvg_acceptance.py --mode run --snapshot workspace --revision HEAD --godot-bin $env:GODOT_BIN --timeout-sec 1200
      - name: Optional seeded mutation experiment
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mutation_probe }}
        run: python scripts/python/run_mvg_mutation_probe.py --snapshot commit --revision HEAD
      - name: Upload execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mvg-integration-evidence
          path: |
            logs/ci/mvg-acceptance/**
            logs/ci/mvg-mutation/**
            !logs/**/snapshot/**
          retention-days: 14
