name: Pre-merge lastking adaptation

on:
  push:
    branches:
      - align-newrouge-features-20260912
    paths:
      - .github/workflows/premerge-lastking-adaptation.yml

permissions:
  contents: write

jobs:
  adapt:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: align-newrouge-features-20260912
          fetch-depth: 0
      - name: Adapt copied tooling to lastking facts
        shell: pwsh
        run: |
          @'
          import json
          import pathlib
          import shutil
          import subprocess

          root = pathlib.Path.cwd()

          # This skill is source-repository incident history, not generic workflow tooling.
          shutil.rmtree(root / '.agents/skills/pr-ci-artifact-repair', ignore_errors=True)

          binding = {
              'task_id': 54,
              'scene': 'Game.Godot/Scenes/Screens/BattleMapScreen.tscn',
              'node': '.',
              'script': 'Game.Godot/Scripts/Screens/BattleMapScreen.gd',
              'witness': 'func _initialize_battle_screen() -> void:',
          }
          aliases = {
              '建筑': ['Building'],
              '地图': ['BattleMap'],
              '存档': ['Save'],
              '战斗': ['Combat'],
          }

          config_path = root / 'scripts/python/project_health_knowledge_config.json'
          config = json.loads(config_path.read_text(encoding='utf-8-sig'))
          config['task_scene_bindings'] = [binding]
          config['query_aliases'] = aliases
          config_path.write_text(json.dumps(config, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          py_path = root / 'scripts/python/project_health_knowledge.py'
          text = py_path.read_text(encoding='utf-8')
          old = """    'task_scene_bindings': [{\n        'task_id': 115, 'scene': 'Game.Godot/Scenes/Reward.tscn', 'node': '.',\n        'script': 'Game.Godot/Scripts/RewardScene.gd',\n        'witness': 'func _claim_reward(reward_type: String, selected_card_id: String, selected_index: int) -> void:'\n    }],\n    'query_aliases': {'奖励': ['Reward'], '存档': ['Save'], '战斗': ['Combat']},"""
          new = """    'task_scene_bindings': [{\n        'task_id': 54, 'scene': 'Game.Godot/Scenes/Screens/BattleMapScreen.tscn', 'node': '.',\n        'script': 'Game.Godot/Scripts/Screens/BattleMapScreen.gd',\n        'witness': 'func _initialize_battle_screen() -> void:'\n    }],\n    'query_aliases': {'建筑': ['Building'], '地图': ['BattleMap'], '存档': ['Save'], '战斗': ['Combat']},"""
          if old not in text:
              raise SystemExit('project_health_knowledge.py default block not found')
          py_path.write_text(text.replace(old, new, 1), encoding='utf-8')

          policy_path = root / 'knowledge/policies/consumer-policies.v1.json'
          policy = json.loads(policy_path.read_text(encoding='utf-8-sig'))
          review = next(p for p in policy['policies'] if p['consumer'] == 'review')
          review['context_query_terms']['delivery-context'] = ['workflow', 'failure', 'analysis']
          policy_path.write_text(json.dumps(policy, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          docs_path = root / 'docs/workflows/project-health-knowledge.md'
          docs = docs_path.read_text(encoding='utf-8')
          replacements = {
              'T24 可从声明测试、服务符号和共享卡 ID 找到初始牌组数据候选；T115 可看到 Reward 场景节点、动态纹理脚本线索及素材。':
                  'T54 可从任务来源定位 BattleMapScreen 场景、根脚本与运行测试线索；其他任务仍按各自 test_refs、场景引用和配置证据构造候选。',
              '`query_aliases`: 中文术语到短查询数组。每个别名作为独立 query 执行，原始输入保留。默认提供奖励/Reward、存档/Save、战斗/Combat；不是自动翻译或跨语言向量检索。':
                  '`query_aliases`: 中文术语到短查询数组。每个别名作为独立 query 执行，原始输入保留。lastking 默认提供建筑/Building、地图/BattleMap、存档/Save、战斗/Combat；不是自动翻译或跨语言向量检索。',
              '默认以任务 115 为可审查的映射实例：`Reward.tscn` 根节点挂载 `RewardScene.gd`，脚本含 `_claim_reward(...)` 实现。该声明只认定静态接入，并非重新验收任务 115。节点路径 `.` 表示根节点。配置失效会列入 invalid_declarations，不继续标记静态接入。':
                  'lastking 默认以任务 54 为可审查的映射实例：`BattleMapScreen.tscn` 根节点挂载 `BattleMapScreen.gd`，脚本含 `_initialize_battle_screen()` 实现。该声明只认定静态接入，并非重新验收任务 54。节点路径 `.` 表示根节点。配置失效会列入 invalid_declarations，不继续标记静态接入。',
              'py -3 scripts/python/project_health_knowledge.py task --task-id 115':
                  'py -3 scripts/python/project_health_knowledge.py task --task-id 54',
              "'{\"query\":\"奖励确认\",\"consumer\":\"repository-session\"}' | py -3 scripts/python/project_health_knowledge.py query":
                  "'{\"query\":\"战斗地图\",\"consumer\":\"repository-session\"}' | py -3 scripts/python/project_health_knowledge.py query",
              "'{\"query\":\"RewardScene\",\"target\":{\"type\":\"file\",\"id\":\"Game.Godot/Scripts/RewardScene.gd\"}}' | py -3 scripts/python/project_health_knowledge.py query":
                  "'{\"query\":\"BattleMapScreen\",\"target\":{\"type\":\"file\",\"id\":\"Game.Godot/Scripts/Screens/BattleMapScreen.gd\"}}' | py -3 scripts/python/project_health_knowledge.py query",
          }
          for old_text, new_text in replacements.items():
              if old_text in docs:
                  docs = docs.replace(old_text, new_text)
          docs_path.write_text(docs, encoding='utf-8')

          head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          plan = f'''# Project Health Knowledge Integration\n\n- Title: Project Health Knowledge Integration\n- Status: active\n- Branch: align-newrouge-features-20260912\n- Git Head: {head}\n- Goal: Align main-only Knowledge/Impact investigation and local Project Health service with upstream while binding runtime examples to lastking repository facts.\n- Scope: CLI/API, GDD configuration, SSOT task pagination, static scene attachment evidence, and pre-merge target adaptation.\n- Current step: Complete pre-merge target-repository adaptation and CI validation.\n- Last completed step: Removed source-only CI repair history and replaced the invalid upstream Task 115/Reward binding with lastking Task 54/BattleMapScreen evidence.\n- Stop-loss: Do not import newrouge gameplay fixtures or weaken repository recovery/Impact validation to make copied tooling pass.\n- Next action: Run focused Project Health/Impact regression checks and repository PR CI; merge only if green.\n- Recovery command: py -3 scripts/python/validate_recovery_docs.py --dir all\n- Open questions: Native developer-machine browser interaction and local GODOT_BIN execution remain environment-dependent; repository CI is the merge gate.\n- Exit criteria: Target-specific defaults are valid, focused regression checks pass, and PR checks are green.\n- Related ADRs: docs/adr/ADR-0036-project-health-investigation.md\n- Related decision logs: decision-logs/2026-09-07-project-health-impact-limits.md\n- Related task id(s): T54 is used only as a static mapping example; this change is repository tooling, not a gameplay task implementation.\n- Related run id: n/a - pre-merge adaptation\n- Related latest.json: logs/ci/project-health-knowledge/latest.json\n- Related pipeline artifacts: n/a - use PR #98 GitHub Actions checks\n\n## Scope\n\nKeep the imported Knowledge/Impact and loopback Project Health behavior aligned with upstream, while ensuring target defaults describe files and tasks that actually exist in lastking. Protocol schema identifiers remain unchanged for upstream compatibility.\n\n## Target Adaptation\n\n- Removed `.agents/skills/pr-ci-artifact-repair` because it encodes newrouge-specific PR/run history and Game.Core incident assumptions rather than reusable chapter workflow behavior.\n- Rebound `task_scene_bindings` from upstream Task 115/Reward to lastking Task 54/BattleMapScreen.\n- Replaced the source-specific `CardPoolSelection` review query hint with generic workflow/failure/analysis terms.\n- Updated the Project Health workflow documentation to describe the lastking default mapping and aliases.\n\n## Validation\n\n- `py -3 -m unittest scripts.python.tests.test_impact_analysis_handoff scripts.python.tests.test_impact_analyzer scripts.sc.tests.test_project_health_knowledge scripts.sc.tests.test_project_health_navigation scripts.sc.tests.test_project_health_runtime_snapshot scripts.sc.tests.test_project_health_server`\n- `node --check scripts/python/project_health_knowledge.js`\n- `git diff --check origin/main...HEAD`\n- Verify configured Task 54 scene, root script assignment and witness exist in the repository.\n\n## Observed Results\n\nThe upstream historical Task 115/Reward scan counts and PR 166 run ids are intentionally not carried forward as lastking evidence. Results for this branch are represented by PR #98 checks and the focused validation commands above.\n'''
          (root / 'execution-plans/2026-09-07-project-health-knowledge.md').write_text(plan, encoding='utf-8')

          decision = f'''# Project Health Impact Limits\n\n- Title: Project Health Impact Limits and Target Adaptation\n- Date: 2026-09-12\n- Status: accepted\n- Supersedes: n/a - imported upstream decision adapted for lastking\n- Superseded by: n/a - active decision\n- Branch: align-newrouge-features-20260912\n- Git Head: {head}\n- Why now: Pre-merge review found source-repository incident history and an invalid Task 115/Reward default binding in the copied tooling.\n- Context: Core Project Health/Impact behavior is reusable, but repository-specific examples must resolve against lastking rather than newrouge.\n- Decision: Preserve formal Impact/KCP boundaries and upstream schema identifiers, remove source-only CI repair history, and bind Project Health defaults only to verified lastking files.\n- Consequences: Project Health starts with a real lastking static mapping; future CI repair guidance is not contaminated by newrouge PR history; protocol compatibility is preserved.\n- Recovery impact: Validate recovery docs and PR CI before merge; do not import source gameplay fixtures solely to satisfy upstream assumptions.\n- Validation: Run py -3 scripts/python/validate_recovery_docs.py --dir all plus focused Impact/Project Health tests and PR checks.\n- Related ADRs: docs/adr/ADR-0036-project-health-investigation.md\n- Related execution plans: execution-plans/2026-09-07-project-health-knowledge.md\n- Related task id(s): T54 is static evidence only; no gameplay behavior is changed by this decision.\n- Related run id: n/a - pre-merge adaptation\n- Related latest.json: logs/ci/project-health-knowledge/latest.json\n- Related pipeline artifacts: n/a - use PR #98 GitHub Actions checks\n\n## Decision\n\nThe local investigation page must remain exploratory and must not create authoritative chapter handoffs. Formal Impact behavior remains strict. Repository-specific defaults must point to real target files and cannot be copied blindly from the source repository.\n\n## Target Evidence\n\nTask 54 is present in lastking's task SSOT. `Game.Godot/Scenes/Screens/BattleMapScreen.tscn` assigns `Game.Godot/Scripts/Screens/BattleMapScreen.gd` on the root node, and that script contains `func _initialize_battle_screen() -> void:`. This is sufficient for the existing conservative `static_attached` declaration model and does not claim runtime verification.\n\n## Limits\n\nRuntime Godot verification still requires an actual `GODOT_BIN` execution path. Static attachment does not prove gameplay correctness. Imported `newrouge.*` schema identifiers are retained as protocol identifiers for compatibility; they are not evidence that lastking gameplay equals newrouge.\n'''
          (root / 'decision-logs/2026-09-07-project-health-impact-limits.md').write_text(decision, encoding='utf-8')

          # Assert the target binding against repository content before committing.
          scene_text = (root / binding['scene']).read_text(encoding='utf-8-sig')
          script_text = (root / binding['script']).read_text(encoding='utf-8-sig')
          expected_ext = 'path="res://' + binding['script'] + '"'
          if expected_ext not in scene_text or 'script = ExtResource("1")' not in scene_text:
              raise SystemExit('BattleMapScreen root script assignment not found')
          if binding['witness'] not in script_text:
              raise SystemExit('BattleMapScreen witness not found')
          if 'Game.Godot/Scenes/Reward.tscn' in config_path.read_text(encoding='utf-8'):
              raise SystemExit('source Reward binding remains in config')
          '@ | py -3 -
      - name: Focused regression validation
        shell: pwsh
        env:
          CI: ''
        run: |
          py -3 -m unittest scripts.python.tests.test_impact_analysis_handoff scripts.python.tests.test_impact_analyzer scripts.sc.tests.test_project_health_knowledge scripts.sc.tests.test_project_health_navigation scripts.sc.tests.test_project_health_runtime_snapshot scripts.sc.tests.test_project_health_server
          node --check scripts/python/project_health_knowledge.js
          py -3 scripts/python/validate_recovery_docs.py --dir all
          git diff --check origin/main...HEAD
      - name: Commit adaptation and self-clean workflow
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/premerge-lastking-adaptation.yml
          git add -A
          git commit -m "fix(tooling): adapt imported project health defaults to lastking"
          git push origin HEAD:align-newrouge-features-20260912
