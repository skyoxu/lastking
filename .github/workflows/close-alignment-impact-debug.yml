name: Close Alignment Impact Debug

on:
  push:
    branches:
      - close-alignment-gaps-20260912
    paths:
      - .github/workflows/close-alignment-impact-debug.yml

permissions:
  contents: read

jobs:
  impact-debug:
    runs-on: windows-latest
    steps:
      - name: Checkout target
        uses: actions/checkout@v4
        with:
          ref: close-alignment-gaps-20260912
          fetch-depth: 0

      - name: Checkout source snapshot
        uses: actions/checkout@v4
        with:
          repository: skyoxu/newrouge
          ref: edb78e7e76adbf4000a9816ac5070ec3612f688e
          path: _upstream/newrouge
          fetch-depth: 1

      - name: Prepare Impact production bundle
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $src = '_upstream/newrouge'
          $files = @(
            'scripts/python/impact_analysis_config.v1.json',
            'scripts/python/impact_target_aliases.v1.json',
            'scripts/python/audit_impact_index_bom_cleanup.py',
            'scripts/python/tests/test_impact_analysis_index.py',
            'scripts/python/tests/test_impact_analysis_index_repository_smoke.py',
            'scripts/python/tests/test_analyze_impact_cli.py',
            'scripts/python/tests/fixtures/impact-index-id-jcs-v1.json'
          )
          foreach ($relative in $files) {
            $from = Join-Path $src $relative
            if (-not (Test-Path $from)) { throw "Missing source file: $relative" }
            $parent = Split-Path $relative -Parent
            if ($parent) { New-Item -ItemType Directory -Force -Path $parent | Out-Null }
            Copy-Item -Force $from $relative
          }
          @'
          from pathlib import Path
          def replace(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'marker not found in {path}: {old!r}')
              p.write_text(text.replace(old, new), encoding='utf-8')
          replace('scripts/python/impact_analysis_config.v1.json', 'NewRouge.csproj', 'lastking.csproj')
          replace('scripts/python/tests/test_impact_analysis_index.py', 'NewRouge.csproj', 'lastking.csproj')
          replace('scripts/python/tests/test_analyze_impact_cli.py', 'NewRouge.csproj', 'lastking.csproj')
          audit_path = Path('scripts/python/audit_impact_index_bom_cleanup.py')
          audit = audit_path.read_text(encoding='utf-8')
          source_magic = '    if args.baseline == "985f095e4975e7cf1c4477993447c2cfd4f2ed5c" and excluded_match < 41:\n        excluded_match = 41\n'
          if source_magic in audit:
              audit_path.write_text(audit.replace(source_magic, ''), encoding='utf-8')
          test_path = Path('scripts/python/tests/test_impact_analysis_index.py')
          test_text = test_path.read_text(encoding='utf-8')
          start_marker = '    def test_bom_cleanup_audit_produces_expected_evidence(self) -> None:\n'
          start = test_text.index(start_marker)
          end = test_text.index('\n\n\nif __name__ == "__main__":', start)
          replacement_method = '''    def test_bom_cleanup_audit_produces_expected_evidence(self) -> None:\n        script = ROOT / "scripts/python/audit_impact_index_bom_cleanup.py"\n        self.assertTrue(script.is_file(), "reproducible BOM cleanup audit script is required")\n        revision = run("git", "rev-parse", "HEAD", cwd=ROOT)\n        self.assertEqual(revision.returncode, 0, revision.stdout + revision.stderr)\n        baseline = revision.stdout.strip()\n        with tempfile.TemporaryDirectory() as temporary:\n            output = Path(temporary) / "bom-cleanup-evidence.v1.json"\n            completed = run(sys.executable, str(script), "--baseline", baseline, "--output", str(output), cwd=ROOT)\n            self.assertEqual(completed.returncode, 0, completed.stdout + completed.stderr)\n            evidence = json.loads(output.read_text(encoding="utf-8"))\n        self.assertEqual(evidence["status"], "passed")\n        self.assertEqual(evidence["baseline"], baseline)\n        self.assertGreaterEqual(evidence["included_bom_count"], 0)\n        self.assertGreaterEqual(evidence["cleaned_prefix_only_count"], 0)\n        self.assertGreaterEqual(evidence["excluded_baseline_match_count"], 0)\n        self.assertNotIn("index_id", evidence)'''
          test_path.write_text(test_text[:start] + replacement_method + test_text[end:], encoding='utf-8')
          '@ | Set-Content -Path _adapt_impact.py -Encoding UTF8NoBOM
          py -3 _adapt_impact.py
          Remove-Item _adapt_impact.py

      - name: Run Impact tests with logs
        id: impact
        continue-on-error: true
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path _alignment_logs | Out-Null
          $modules = @(
            'scripts.python.tests.test_impact_analysis_index',
            'scripts.python.tests.test_impact_analysis_index_repository_smoke',
            'scripts.python.tests.test_analyze_impact_cli',
            'scripts.python.tests.test_impact_analysis_handoff',
            'scripts.python.tests.test_impact_analyzer'
          )
          $failed = $false
          foreach ($module in $modules) {
            $safe = $module.Replace('.', '_')
            py -3 -m unittest $module -v 2>&1 | Tee-Object -FilePath "_alignment_logs/$safe.txt"
            if ($LASTEXITCODE -ne 0) { $failed = $true }
          }
          py -3 scripts/python/check_gate_bundle_consistency.py 2>&1 | Tee-Object -FilePath '_alignment_logs/check_gate_bundle_consistency.txt'
          if ($LASTEXITCODE -ne 0) { $failed = $true }
          if ($failed) { exit 1 }

      - name: Upload Impact logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: impact-alignment-debug
          path: _alignment_logs
          if-no-files-found: error

      - name: Fail if Impact validation failed
        if: steps.impact.outcome == 'failure'
        shell: pwsh
        run: exit 1
