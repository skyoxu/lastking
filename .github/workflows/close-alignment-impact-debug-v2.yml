name: Close Alignment Impact Debug V2

on:
  push:
    branches: [close-alignment-gaps-20260912]
    paths: [.github/workflows/close-alignment-impact-debug-v2.yml]

permissions:
  contents: read

jobs:
  impact-debug:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: close-alignment-gaps-20260912
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: skyoxu/newrouge
          ref: edb78e7e76adbf4000a9816ac5070ec3612f688e
          path: _upstream/newrouge
          fetch-depth: 1
      - name: Prepare adapted Impact bundle
        shell: pwsh
        run: |
          $src = '_upstream/newrouge'
          $files = @(
            'scripts/python/impact_analysis_config.v1.json',
            'scripts/python/impact_target_aliases.v1.json',
            'scripts/python/audit_impact_index_bom_cleanup.py',
            'scripts/python/tests/test_impact_analysis_index.py',
            'scripts/python/tests/test_impact_analysis_index_repository_smoke.py',
            'scripts/python/tests/test_analyze_impact_cli.py',
            'scripts/python/tests/fixtures/impact-index-id-jcs-v1.json'
          )
          foreach ($relative in $files) {
            $parent = Split-Path $relative -Parent
            if ($parent) { New-Item -ItemType Directory -Force -Path $parent | Out-Null }
            Copy-Item -Force (Join-Path $src $relative) $relative
          }
          @'
          from pathlib import Path
          import json
          def rep(path, old, new):
              p=Path(path); t=p.read_text(encoding='utf-8'); p.write_text(t.replace(old,new),encoding='utf-8')
          rep('scripts/python/impact_analysis_config.v1.json','NewRouge.csproj','lastking.csproj')
          rep('scripts/python/tests/test_impact_analysis_index.py','NewRouge.csproj','lastking.csproj')
          rep('scripts/python/tests/test_analyze_impact_cli.py','NewRouge.csproj','lastking.csproj')
          p=Path('scripts/python/impact_analysis_config.v1.json'); cfg=json.loads(p.read_text(encoding='utf-8')); cfg['identity_files']=[x for x in cfg['identity_files'] if x!='global.json']; p.write_text(json.dumps(cfg,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          p=Path('scripts/python/audit_impact_index_bom_cleanup.py'); t=p.read_text(encoding='utf-8'); t=t.replace('    if args.baseline == "985f095e4975e7cf1c4477993447c2cfd4f2ed5c" and excluded_match < 41:\n        excluded_match = 41\n',''); p.write_text(t,encoding='utf-8')
          p=Path('scripts/python/tests/test_impact_analysis_index.py'); t=p.read_text(encoding='utf-8'); s=t.index('    def test_bom_cleanup_audit_produces_expected_evidence(self) -> None:\n'); e=t.index('\n\n\nif __name__ == "__main__":',s); m='''    def test_bom_cleanup_audit_produces_expected_evidence(self) -> None:\n        script = ROOT / "scripts/python/audit_impact_index_bom_cleanup.py"\n        self.assertTrue(script.is_file())\n        revision = run("git", "rev-parse", "HEAD", cwd=ROOT)\n        self.assertEqual(revision.returncode, 0, revision.stdout + revision.stderr)\n        baseline = revision.stdout.strip()\n        with tempfile.TemporaryDirectory() as temporary:\n            output = Path(temporary) / "bom-cleanup-evidence.v1.json"\n            completed = run(sys.executable, str(script), "--baseline", baseline, "--output", str(output), cwd=ROOT)\n            self.assertEqual(completed.returncode, 0, completed.stdout + completed.stderr)\n            evidence = json.loads(output.read_text(encoding="utf-8"))\n        self.assertEqual(evidence["status"], "passed")\n        self.assertEqual(evidence["baseline"], baseline)\n        self.assertNotIn("index_id", evidence)'''; p.write_text(t[:s]+m+t[e:],encoding='utf-8')
          p=Path('scripts/python/run_gate_bundle.py'); t=p.read_text(encoding='utf-8'); needle='                "scripts.sc.tests.test_migrate_task_optional_hints",\n                "-v",'; insertion='''                "scripts.sc.tests.test_migrate_task_optional_hints",\n                "scripts.python.tests.test_impact_analysis_index",\n                "scripts.python.tests.test_impact_analysis_index_repository_smoke",\n                "scripts.python.tests.test_analyze_impact_cli",\n                "scripts.python.tests.test_impact_analyzer",\n                "scripts.python.tests.test_run_single_task_chapter6_lane",\n                "-v",'''; p.write_text(t.replace(needle,insertion),encoding='utf-8')
          '@ | Set-Content _adapt.py -Encoding UTF8NoBOM
          py -3 _adapt.py
          Remove-Item _adapt.py
      - name: Run Impact tests with logs
        id: impact
        continue-on-error: true
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force _alignment_logs | Out-Null
          $modules=@('scripts.python.tests.test_impact_analysis_index','scripts.python.tests.test_impact_analysis_index_repository_smoke','scripts.python.tests.test_analyze_impact_cli','scripts.python.tests.test_impact_analysis_handoff','scripts.python.tests.test_impact_analyzer')
          $failed=$false
          foreach($module in $modules){$safe=$module.Replace('.','_'); py -3 -m unittest $module -v 2>&1 | Tee-Object -FilePath "_alignment_logs/$safe.txt"; if($LASTEXITCODE-ne 0){$failed=$true}}
          py -3 scripts/python/check_gate_bundle_consistency.py 2>&1 | Tee-Object -FilePath _alignment_logs/check_gate_bundle_consistency.txt
          if($LASTEXITCODE-ne 0){$failed=$true}
          if($failed){exit 1}
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: impact-alignment-debug-v2
          path: _alignment_logs
          if-no-files-found: error
      - name: Fail if validation failed
        if: steps.impact.outcome == 'failure'
        shell: pwsh
        run: exit 1
