name: Close Alignment Gaps V4

on:
  push:
    branches:
      - close-alignment-gaps-20260912
    paths:
      - .github/workflows/close-alignment-gaps-v4.yml

permissions:
  contents: write

jobs:
  close-gaps:
    runs-on: windows-latest
    steps:
      - name: Checkout target
        uses: actions/checkout@v4
        with:
          ref: close-alignment-gaps-20260912
          fetch-depth: 0

      - name: Checkout source snapshot
        uses: actions/checkout@v4
        with:
          repository: skyoxu/newrouge
          ref: edb78e7e76adbf4000a9816ac5070ec3612f688e
          path: _upstream/newrouge
          fetch-depth: 1

      - name: Copy bounded bundles
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $src = '_upstream/newrouge'
          $files = @(
            'scripts/python/_chapter7_profile.py',
            'scripts/python/collect_ui_wiring_inputs.py',
            'scripts/python/run_chapter7_ui_wiring.py',
            'scripts/python/chapter7_ui_gdd_writer.py',
            'scripts/python/create_chapter7_tasks_from_ui_candidates.py',
            'scripts/python/validate_chapter7_ui_wiring.py',
            'scripts/python/validate_chapter7_artifact_manifest.py',
            'scripts/python/tests/test_chapter7_ui_wiring.py',
            'docs/workflows/chapter7-profile-guide.md',
            'docs/workflows/templates/chapter7-profile.template.json',
            'docs/workflows/templates/chapter7-profile.minimal.example.json',
            'scripts/python/init_knowledge_catalog.py',
            'scripts/python/publish_knowledge_catalog.py',
            'scripts/python/knowledge_locator.py',
            'scripts/python/evaluate_knowledge_queries.py',
            'scripts/python/validate_knowledge_control_plane.py',
            'scripts/python/prepare_knowledge_context.py',
            'scripts/python/freeze_knowledge_context.py',
            'scripts/python/knowledge_binding_producer.py',
            'scripts/python/run_single_task_chapter6_lane.py',
            'scripts/python/tests/test_knowledge_control_plane.py',
            'scripts/python/tests/test_knowledge_chapter5_routing.py',
            'scripts/python/tests/test_knowledge_chapter6_routing.py',
            'scripts/python/tests/test_run_single_task_chapter6_lane.py',
            'scripts/python/tests/test_knowledge_review_routing.py',
            'scripts/python/tests/test_knowledge_freeze.py',
            'scripts/python/tests/test_knowledge_publication.py',
            'docs/adr/ADR-0035-repository-knowledge-control-plane.md',
            'docs/workflows/knowledge-context-shadow.md',
            'docs/workflows/knowledge-context-freeze.md',
            'docs/workflows/knowledge-catalog-main-publish.md',
            'scripts/python/impact_analysis_config.v1.json',
            'scripts/python/impact_target_aliases.v1.json',
            'scripts/python/audit_impact_index_bom_cleanup.py',
            'scripts/python/tests/test_impact_analysis_index.py',
            'scripts/python/tests/test_impact_analysis_index_repository_smoke.py',
            'scripts/python/tests/test_analyze_impact_cli.py',
            'scripts/python/tests/fixtures/impact-index-id-jcs-v1.json'
          )
          foreach ($relative in $files) {
            $from = Join-Path $src $relative
            if (-not (Test-Path $from)) { throw "Missing source file: $relative" }
            $parent = Split-Path $relative -Parent
            if ($parent) { New-Item -ItemType Directory -Force -Path $parent | Out-Null }
            Copy-Item -Force $from $relative
          }

      - name: Adapt copied tooling to lastking
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          from pathlib import Path

          def replace(path: str, old: str, new: str, required: bool = True) -> None:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if required and old not in text:
                  raise SystemExit(f'marker not found in {path}: {old!r}')
              p.write_text(text.replace(old, new), encoding='utf-8')

          replace('scripts/python/init_knowledge_catalog.py', '"project": "newrouge"', '"project": "lastking"')
          replace('scripts/python/knowledge_locator.py', 'Locate authoritative newrouge repository knowledge without synthesizing answers.', 'Locate authoritative repository knowledge without synthesizing answers.')
          replace('scripts/python/validate_knowledge_control_plane.py', 'Terminal validation for the newrouge repository Knowledge Control Plane.', 'Terminal validation for the repository Knowledge Control Plane.')
          replace('docs/adr/ADR-0035-repository-knowledge-control-plane.md', '`newrouge`', '`lastking`')
          replace('scripts/python/impact_analysis_config.v1.json', 'NewRouge.csproj', 'lastking.csproj')
          replace('scripts/python/tests/test_impact_analysis_index.py', 'NewRouge.csproj', 'lastking.csproj')
          replace('scripts/python/tests/test_analyze_impact_cli.py', 'NewRouge.csproj', 'lastking.csproj')
          replace('scripts/python/tests/test_chapter7_ui_wiring.py', 'self.assertTrue(contract["repo_root"].endswith(root.as_posix()))', 'self.assertEqual(Path(contract["repo_root"]).resolve(), root.resolve())')

          audit_path = Path('scripts/python/audit_impact_index_bom_cleanup.py')
          audit = audit_path.read_text(encoding='utf-8')
          source_magic = '    if args.baseline == "985f095e4975e7cf1c4477993447c2cfd4f2ed5c" and excluded_match < 41:\n        excluded_match = 41\n'
          if source_magic not in audit:
              raise SystemExit('source-specific BOM compatibility marker not found')
          audit_path.write_text(audit.replace(source_magic, ''), encoding='utf-8')

          test_path = Path('scripts/python/tests/test_impact_analysis_index.py')
          test_text = test_path.read_text(encoding='utf-8')
          start_marker = '    def test_bom_cleanup_audit_produces_expected_evidence(self) -> None:\n'
          start = test_text.index(start_marker)
          end = test_text.index('\n\n\nif __name__ == "__main__":', start)
          replacement_method = '''    def test_bom_cleanup_audit_produces_expected_evidence(self) -> None:\n        script = ROOT / "scripts/python/audit_impact_index_bom_cleanup.py"\n        self.assertTrue(script.is_file(), "reproducible BOM cleanup audit script is required")\n        revision = run("git", "rev-parse", "HEAD", cwd=ROOT)\n        self.assertEqual(revision.returncode, 0, revision.stdout + revision.stderr)\n        baseline = revision.stdout.strip()\n        with tempfile.TemporaryDirectory() as temporary:\n            output = Path(temporary) / "bom-cleanup-evidence.v1.json"\n            completed = run(\n                sys.executable,\n                str(script),\n                "--baseline",\n                baseline,\n                "--output",\n                str(output),\n                cwd=ROOT,\n            )\n            self.assertEqual(completed.returncode, 0, completed.stdout + completed.stderr)\n            evidence = json.loads(output.read_text(encoding="utf-8"))\n        self.assertEqual(evidence["status"], "passed")\n        self.assertEqual(evidence["baseline"], baseline)\n        self.assertGreaterEqual(evidence["included_bom_count"], 0)\n        self.assertGreaterEqual(evidence["cleaned_prefix_only_count"], 0)\n        self.assertGreaterEqual(evidence["excluded_baseline_match_count"], 0)\n        self.assertNotIn("index_id", evidence)'''
          test_path.write_text(test_text[:start] + replacement_method + test_text[end:], encoding='utf-8')

          gate_path = Path('scripts/python/run_gate_bundle.py')
          gate = gate_path.read_text(encoding='utf-8')
          if 'scripts.python.tests.test_impact_analysis_index_repository_smoke' not in gate:
              needle = '                "scripts.sc.tests.test_migrate_task_optional_hints",\n                "-v",'
              if needle not in gate:
                  raise SystemExit('target obligations unittest marker not found')
              insertion = '''                "scripts.sc.tests.test_migrate_task_optional_hints",\n                "scripts.python.tests.test_impact_analysis_index",\n                "scripts.python.tests.test_impact_analysis_index_repository_smoke",\n                "scripts.python.tests.test_analyze_impact_cli",\n                "scripts.python.tests.test_impact_analyzer",\n                "scripts.python.tests.test_run_single_task_chapter6_lane",\n                "-v",'''
              gate_path.write_text(gate.replace(needle, insertion), encoding='utf-8')

          routing = Path('docs/agents/13-rag-sources-and-session-ssot.md')
          routing_text = routing.read_text(encoding='utf-8')
          if '## Knowledge Control Plane' not in routing_text:
              routing_text = routing_text.rstrip() + '''\n\n## Knowledge Control Plane\nUse `scripts/python/knowledge_locator.py` as the deterministic location-only lookup when a current published catalog is available. Locator candidates are not semantic truth: re-read the repository source and verify its hash before accepting context.\n\nChapter 4/5/6 and review may use the observe-only flow in `docs/workflows/knowledge-context-shadow.md`, followed by the explicit decision/freeze contract in `docs/workflows/knowledge-context-freeze.md`. If publication is missing, stale, or blocked, fall back to the direct authoritative source routes listed above; do not rebuild global knowledge implicitly.\n'''
              routing.write_text(routing_text, encoding='utf-8')

          adr_index = Path('docs/architecture/ADR_INDEX_GODOT.md')
          adr_text = adr_index.read_text(encoding='utf-8')
          if 'ADR-0035' not in adr_text:
              needle = '- ADR-0030: Core 线程模型（Single-Thread Core + 明确跨线程边界） — `docs/adr/ADR-0030-core-threading-model.md`'
              if needle not in adr_text:
                  raise SystemExit('ADR index insertion marker not found')
              adr_text = adr_text.replace(needle, needle + '\n- ADR-0035: Repository Knowledge Control Plane — `docs/adr/ADR-0035-repository-knowledge-control-plane.md`')
              adr_index.write_text(adr_text, encoding='utf-8')
          '@ | Set-Content -Path _adapt_alignment.py -Encoding UTF8NoBOM
          py -3 _adapt_alignment.py
          Remove-Item _adapt_alignment.py

      - name: Generate target Chapter 7 profile
        shell: pwsh
        run: |
          @'
          import importlib.util
          import json
          from pathlib import Path
          root = Path.cwd()
          spec = importlib.util.spec_from_file_location('chapter7_profile_alignment', root / 'scripts/python/_chapter7_profile.py')
          module = importlib.util.module_from_spec(spec)
          assert spec and spec.loader
          spec.loader.exec_module(module)
          profile = module.build_default_chapter7_profile()
          payload = {
              'surface_aliases': profile['surface_aliases'],
              'task_creation': profile['task_creation'],
              'buckets': {name: {'section_headings': profile['buckets'][name]['section_headings']} for name in module.bucket_names(profile)},
          }
          out = root / 'docs/workflows/chapter7-profile.json'
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(json.dumps(payload, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          '@ | Set-Content -Path _make_target_profile.py -Encoding UTF8NoBOM
          py -3 _make_target_profile.py
          Remove-Item _make_target_profile.py

      - name: Initialize target resource knowledge catalog
        shell: pwsh
        run: |
          py -3 scripts/python/init_knowledge_catalog.py --repo-root . --validate

      - name: Validate Knowledge and Chapter 7
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:CI = ''
          py -3 scripts/python/validate_knowledge_control_plane.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          py -3 -m unittest scripts.python.tests.test_chapter7_ui_wiring -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate Impact production bundle
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          py -3 -m unittest scripts.python.tests.test_impact_analysis_index scripts.python.tests.test_impact_analysis_index_repository_smoke scripts.python.tests.test_analyze_impact_cli scripts.python.tests.test_impact_analysis_handoff scripts.python.tests.test_impact_analyzer -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          py -3 scripts/python/check_gate_bundle_consistency.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Regress Project Health
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:CI = ''
          py -3 -m unittest scripts.sc.tests.test_project_health_knowledge scripts.sc.tests.test_project_health_navigation scripts.sc.tests.test_project_health_runtime_snapshot scripts.sc.tests.test_project_health_server -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check scripts/python/project_health_knowledge.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate target adaptations
        shell: pwsh
        run: |
          @'
          import importlib.util
          import json
          from pathlib import Path
          root = Path.cwd()
          impact = json.loads((root / 'scripts/python/impact_analysis_config.v1.json').read_text(encoding='utf-8'))
          assert 'lastking.csproj' in impact['identity_files']
          assert 'NewRouge.csproj' not in impact['identity_files']
          assert (root / 'scripts/python/impact_target_aliases.v1.json').is_file()
          assert (root / 'scripts/python/tests/fixtures/impact-index-id-jcs-v1.json').is_file()
          assert (root / 'scripts/python/tests/test_analyze_impact_cli.py').is_file()
          assert (root / 'scripts/python/tests/test_impact_analysis_index_repository_smoke.py').is_file()
          audit = (root / 'scripts/python/audit_impact_index_bom_cleanup.py').read_text(encoding='utf-8')
          assert '985f095e4975e7cf1c4477993447c2cfd4f2ed5c' not in audit
          catalog = json.loads((root / 'docs/knowledge/catalog/knowledge-catalog.json').read_text(encoding='utf-8'))
          assert catalog['project'] == 'lastking'
          spec = importlib.util.spec_from_file_location('chapter7_profile_verify', root / 'scripts/python/_chapter7_profile.py')
          module = importlib.util.module_from_spec(spec)
          assert spec and spec.loader
          spec.loader.exec_module(module)
          profile = module.load_chapter7_profile(repo_root=root)
          expected = {'entry': 41, 'loop': 42, 'combat': 43, 'economy': 44, 'meta': 45, 'governance': 46}
          assert {name: int(profile['buckets'][name]['wiring_task_id']) for name in expected} == expected
          active = json.loads((root / 'docs/workflows/chapter7-profile.json').read_text(encoding='utf-8'))
          assert 'task_scope' not in active
          assert 'map_path' not in active.get('buckets', {})
          gate = (root / 'scripts/python/run_gate_bundle.py').read_text(encoding='utf-8')
          for module_name in ('scripts.python.tests.test_impact_analysis_index', 'scripts.python.tests.test_impact_analysis_index_repository_smoke', 'scripts.python.tests.test_analyze_impact_cli', 'scripts.python.tests.test_impact_analyzer', 'scripts.python.tests.test_run_single_task_chapter6_lane'):
              assert module_name in gate
          assert not (root / '.agents/skills/pr-ci-artifact-repair').exists()
          assert not (root / 'knowledge/snapshots').exists()
          assert not (root / 'knowledge/indexes/current.json').exists()
          print('target adaptation checks passed')
          '@ | Set-Content -Path _verify_target_adaptations.py -Encoding UTF8NoBOM
          py -3 _verify_target_adaptations.py
          Remove-Item _verify_target_adaptations.py
          py -3 scripts/python/validate_recovery_docs.py --dir all
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --check

      - name: Commit closure and self-clean
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force _upstream
          Remove-Item -Force .github/workflows/close-alignment-gaps.yml
          Remove-Item -Force .github/workflows/close-alignment-gaps-v2.yml
          Remove-Item -Force .github/workflows/close-alignment-gaps-v3.yml
          Remove-Item -Force .github/workflows/close-alignment-gaps-v4.yml
          git add -A
          git diff --cached --check
          if ((git status --porcelain).Length -eq 0) { exit 0 }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(tooling): close workflow knowledge and impact alignment gaps'
          git push origin HEAD:close-alignment-gaps-20260912
